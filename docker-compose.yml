version: '3.8'
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - AUDIO_SAMPLE_RATE=48000
      - DSP_BUFFER_SIZE=512
    restart: always

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
